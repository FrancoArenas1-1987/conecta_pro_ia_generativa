name: Deploy Generative Automation

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT }}
          script_stop: true
          script: |
            export APP_DIR="${{ secrets.PROD_APP_DIR }}"
            export BRANCH="main"
            export RUN_READINESS_CHECK="${{ vars.RUN_READINESS_CHECK || '1' }}"
            export INSTALL_TIMERS="${{ vars.INSTALL_TIMERS || '1' }}"
            bash "$APP_DIR/scripts/deploy_prod.sh"

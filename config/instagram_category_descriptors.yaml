prompt_framework:
  common_strengths:
  - Commercial social-ad clarity with instant trust.
  - 'High visual hierarchy: hero subject + clean support scene.'
  - Strong conversion intent without visual noise.
  - Professional realism with polished color grading.
  common_layout_rules:
  - Hero subject on right or right-center third.
  - Leave clean negative space on left/mid-left for text overlays.
  - Use 3 depth layers (foreground, midground, background) to avoid flat look.
  - Keep lower area readable for CTA/phone badge overlays.
  - Edge-to-edge composition, avoid thick outer margins or framed card look.
  - Keep all critical text and logos inside central safe area with breathing room.
  common_brand_rules:
  - Human expressions must feel close, confident and credible.
  - Wardrobe/tools must match the service and look real.
  - Scene must communicate order, safety and service quality.
  global_poster_structure:
  - Top headline block clearly readable with at least 8% top margin.
  - Middle information block with concise value points/bullets.
  - Bottom CTA band with logo + WhatsApp + website clearly visible.
  - 'Visual hierarchy must read in 3 seconds: headline, value, action.'
  design_finish_rules:
  - Use premium rounded modules and clean section separators.
  - Use coherent iconography for each value point.
  - Use subtle wave/curve accents and soft gradients to avoid flat design.
  - Maintain strict alignment grid and balanced whitespace.
  global_negative_rules:
  - No distorted anatomy, malformed hands or extra fingers.
  - No duplicate faces, no chaotic clutter, no low-resolution blur.
  - No cartoon style unless explicitly requested.
  reference_policy: Analyze category reference image and create a new variation with same visual language, never a direct copy.

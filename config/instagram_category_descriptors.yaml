    layout_density: high information density with clear segmentation
    tone_keywords:
    - accesible
    - claro
    - optimista
    - directo
    information_blocks:
    - Top impact headline with zero-cost proposition.
    - Visual free marker (0$ tag or equivalent symbol).
    - Middle block with trust/professional diversity cues.
    - Bottom contact module with WhatsApp number and brand name.

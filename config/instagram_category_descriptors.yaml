  image_prompt_templates:
  - Vertical 9:16 premium social ad image focused on free contact benefit for service requests in Chile.
  creative_template:
    subject_profile: Client and mixed professionals cast with approachable and optimistic expressions.
    scene_profile: Promotional modern service-ad setting with subtle dynamic shapes and movement cues.
    color_direction: Warm yellow/cream base with green accent for free-value highlight, balanced by clean neutral tones.
    lighting_direction: Bright front lighting with soft shadow separation and ad-like clarity.
    camera_direction: Mid shot with slightly wide framing to include both benefit cue and people.

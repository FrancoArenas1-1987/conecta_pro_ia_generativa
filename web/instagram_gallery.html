<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ConectaProIA - Borradores IG</title>
  <style>
    :root {
      --bg: #0b132b;
      --panel: #1c2541;
      --card: #0f172a;
      --accent: #5bc0be;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --ok: #34d399;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: radial-gradient(circle at 20% 10%, #1c2541 0%, #0b132b 60%);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }
    .wrap {
      width: min(1200px, 97vw);
      margin: 0 auto;
      background: rgba(28, 37, 65, 0.92);
      border: 1px solid rgba(91, 192, 190, 0.35);
      border-radius: 16px;
      padding: 20px;
    }
    .toolbar {
      display: grid;
      grid-template-columns: 1fr 220px;
      gap: 10px;
      margin-bottom: 16px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }
    .card {
      background: var(--card);
      border: 1px solid #334155;
      border-radius: 12px;
      overflow: hidden;
    }
    .card img {
      width: 100%;
      height: 360px;
      object-fit: cover;
      background: #020617;
      border-bottom: 1px solid #334155;
    }
    .body { padding: 10px; }
    .meta { color: var(--muted); font-size: .82rem; }
    .title { font-weight: 700; margin: 4px 0; }
    .caption { white-space: pre-wrap; color: var(--text); font-size: .85rem; }
    button, input {
      width: 100%;
      border: 1px solid #334155;
      background: #111827;
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: .95rem;
    }
    button.primary {
      border: 0;
      background: var(--accent);
      color: #03242d;
      font-weight: 700;
      cursor: pointer;
    }
    .pill {
      display: inline-block;
      margin-top: 4px;
      font-size: .72rem;
      border-radius: 999px;
      border: 1px solid #334155;
      padding: 3px 8px;
      color: var(--muted);
    }
    .pill.ok { color: var(--ok); border-color: var(--ok); }
    a { color: var(--accent); }
    @media (max-width: 760px) {
      .toolbar { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Borradores Instagram</h1>
    <p id="status" class="meta">Cargando...</p>
    <div class="toolbar">
      <input id="limit" type="number" min="1" max="300" value="40" />
      <button id="reload" class="primary" type="button">Actualizar</button>
    </div>
    <div id="grid" class="grid"></div>
  </div>

  <script>
    async function loadDrafts() {
      const limit = Math.max(1, Math.min(300, Number(document.getElementById('limit').value || 40)));
      const status = document.getElementById('status');
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      status.textContent = 'Cargando borradores...';

      try {
        const res = await fetch(`/api/instagram/drafts?limit=${limit}`);
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || 'No se pudo cargar borradores');

        status.textContent = `Borradores encontrados: ${data.count}`;
        if (!data.items || data.items.length === 0) {
          status.textContent = 'No hay borradores aun.';
          return;
        }

        for (const item of data.items) {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <img src="${item.image_url || ''}" alt="${item.category_label || 'draft'}" />
            <div class="body">
              <div class="meta">${item.created_at || '-'} | ${item.format_type || '-'} | ${item.objective || '-'}</div>
              <div class="title">${item.category_label || item.category_id || 'Sin categoria'}</div>
              <div class="meta">${item.short_text_preview || ''}</div>
              <div class="caption">${item.caption_preview || ''}</div>
              <div class="pill ${item.status === 'simulated_published' ? 'ok' : ''}">${item.status || 'draft'}</div>
              <div class="meta" style="margin-top:8px;">
                <a href="${item.image_url || '#'}" target="_blank">Ver imagen</a>
              </div>
            </div>
          `;
          grid.appendChild(card);
        }
      } catch (err) {
        status.textContent = `Error: ${err.message}`;
      }
    }

    document.getElementById('reload').addEventListener('click', loadDrafts);
    loadDrafts();
  </script>
</body>
</html>
